# neoVULCAN configuration for the coupled brown-dwarf example (run_brown_dwarf_neovulcan.py).
#
# Derived from neoVULCAN's cfg_examples/Jupiter.cfg. Only the network, the grid and the switches
# matter here: the temperature, pressure and Kzz profiles and the initial composition are supplied
# by ngam through the coupling driver (pyngam.KineticsCoupling), so the isothermal start and the
# constant Kzz below are placeholders that are overwritten before the first integration.
#
# Relative paths are resolved against the neoVULCAN base directory.

[network]
atom_list            = ["H", "O", "C", "N"]
network = "thermo/NCHO_photo_network_lowT.txt"
gibbs_text           = "thermo/gibbs_text.txt"
com_file             = "thermo/all_compose.txt"
cross_folder         = "thermo/photo_cross/"
use_lowT_limit_rates = true   # low-T rate limits enabled for Jupiter
remove_list          = []

[paths]
atm_file         = "atm/Jupiter_deep_top.txt"
sflux_file       = "atm/stellar_flux/Gueymard_solar.txt"
top_BC_flux_file = "atm/BC_top_Jupiter.txt"
bot_BC_flux_file = "atm/BC_bot.txt"
vul_ini          = "output/"
output_dir       = "output/"
plot_dir         = "plot/"
movie_dir        = "plot/movie/"
out_name = "bd_coupling.vul"

[elements]
use_solar = true
ini_mix            = "EQ"
fastchem_met_scale = 1.0

[elements.metal_abundances]
# customized abundances (used because use_solar = false and ini_mix = "EQ").
# O_H = 6.0618e-4 * 0.5
O  = 3.0309e-4
# X4.28 solar (Atreya 2020 review)
C  = 1.19e-3
# 2.78 x 8.1853e-5  (Li 2017 Juno)
N  = 2.27551e-4
# S omitted (commented out in the legacy file: S_H = 4.45e-5 from Atreya 2020)
# ~0.8 solar (Atreya 2020 review)
He = 0.0785

[elements.const_mix]
# unused when ini_mix = "EQ"; left empty

[atmosphere]
atm_base     = "H2"
rocky        = false
nz = 60
P_b = 1.0e8   # 5 kbar at the deep boundary
P_t = 1.0
use_Kzz      = true
use_moldiff  = true
use_vm_mol   = true    # required: molecular diffusion in the upper atmosphere (neoVULCAN issue found 2026-09-07)
use_vz       = false
atm_type = "isothermal"
Kzz_prof = "const"
K_max        = 1.0e5
K_p_lev      = 0.1
vz_prof      = "const"
gs = 31622.8   # Jupiter surface gravity (cm/s^2)
Tiso = 1500.0
para_warm    = [120.0, 1500.0, 0.1, 0.02, 1.0, 1.0]
# para_anaTP omitted -> aliased to para_warm
const_Kzz = 1.0e9
const_vz     = 0.0
update_frq   = 100
r_star       = 1.0
# Rp = 1.0 * 7.1492e9 (Jupiter radius)
Rp = 7.1492e9
orbit_radius = 5.2
sl_angle_deg = 60.0
f_diurnal    = 0.5

[photochemistry]
use_photo = false
use_ion                = false
scat_sp                = ["H2", "He"]
T_cross_sp             = []
edd                    = 0.5
dbin1                  = 0.1
dbin2                  = 2.0
dbin_12trans           = 240.0
ini_update_photo_frq   = 100
final_update_photo_frq = 5

[boundary_conditions]
use_topflux = false
use_botflux        = false
use_fix_sp_bot     = {}
diff_esc           = []
max_flux           = 1.0e13
use_sat_surfaceH2O = false

[condensation]
use_condense = false
use_settling = false
use_relax = []
humidity                      = 1.0
start_conden_time             = 1.0e6
stop_conden_time              = 1.0e8
# fix_species_time omitted -> aliased to stop_conden_time
condense_sp = []
non_gas_sp = []
fix_species = []
fix_species_from_coldtrap_lev = true
use_ini_cold_trap             = true

[condensation.r_p]
H2O_l_s = 5.0e-5   # 0.5 micron
NH3_l_s = 5.0e-5

[condensation.rho_p]
H2O_l_s = 0.9
NH3_l_s = 0.7

[solver]
ode_solver       = "Ros2"
use_print_prog = true
use_print_delta  = false
print_prog_num = 200
dttry            = 1.0e-10
trun_min         = 1.0e2
runtime          = 1.0e22
dt_min           = 1.0e-14
# dt_max omitted -> derived as runtime * 1e-5
dt_var_max       = 2.0
dt_var_min       = 0.5
count_min        = 120
count_max        = 10000
atol             = 1.0e-1
mtol             = 1.0e-18    # Jupiter uses a looser mtol than Earth (1e-22)
mtol_conv        = 1.0e-16
pos_cut          = 0.0
nega_cut         = -1.0
loss_eps         = 1.0e12
yconv_cri        = 0.01
slope_cri        = 1.0e-4
yconv_min        = 0.1
flux_cri         = 0.1
flux_atol        = 1.0
st_factor        = 0.5
conv_step        = 500
rtol             = 0.05
post_conden_rtol = 0.15
use_adapt_rtol   = true
rtol_min         = 0.02
rtol_max         = 2.5

[output]
output_humanread = false
use_shark        = false
save_evolution   = false
save_evo_frq     = 10
y_time_freq      = 1

[plotting]
plot_TP        = false
use_live_plot = false
use_live_flux  = false
use_plot_end   = false
use_plot_evo   = false
use_save_movie = false
use_flux_movie = false
plot_height    = false
use_PIL        = true
live_plot_frq  = 10
# save_movie_rate omitted -> aliased to live_plot_frq
plot_spec = ["H2O", "CH4", "CO", "NH3"]
